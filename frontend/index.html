<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Harness</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #e9e9e9; background: #212121; }
    .layout { display: flex; height: 100vh; }
    aside { width: 250px; flex: none; padding: 16px 12px; background: #171717; }
    main { display: flex; flex: 1; min-width: 0; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    button { color: inherit; font: inherit; cursor: pointer; }
    .new-chat { width: 100%; padding: 9px 12px; text-align: left; border: 0; border-radius: 8px; background: transparent; }
    .new-chat:hover { background: #2b2b2b; }
    .sidebar-note { margin: 24px 12px; color: #aaa; font-size: 14px; }
    .login { padding: 6px 14px; border: 1px solid #666; border-radius: 20px; background: transparent; }
    .login:disabled { opacity: .55; cursor: default; }
    .messages { flex: 1; overflow-y: auto; padding: 24px max(20px, calc((100% - 760px) / 2)); }
    .empty { margin-top: 22vh; text-align: center; font-size: 25px; }
    .message { margin: 0 0 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { width: fit-content; max-width: 85%; margin-left: auto; padding: 10px 16px; border-radius: 18px; background: #303030; }
    .composer { width: min(100% - 32px, 760px); margin: 0 auto 24px; padding: 12px; border-radius: 24px; background: #303030; }
    textarea { display: block; width: 100%; min-height: 54px; max-height: 200px; resize: vertical; border: 0; outline: 0; color: inherit; background: transparent; font: inherit; }
    .composer button { display: block; margin-left: auto; padding: 6px 16px; border: 0; border-radius: 16px; color: #222; background: #eee; }
    .composer button:disabled { opacity: .5; cursor: default; }
    .status { min-height: 22px; margin: 5px 8px 0; color: #ffb4ab; font-size: 14px; }
    @media (max-width: 600px) { aside { width: 160px; } header { padding: 12px; } .messages { padding: 20px; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <button id="new-chat" class="new-chat" type="button">＋ New chat</button>
      <p class="sidebar-note">Chat history comes later.</p>
    </aside>
    <main>
      <header>
        <h1>Qwen Harness</h1>
        <button class="login" type="button" disabled title="Login comes later">Log in</button>
      </header>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea id="message-input" aria-label="Message" placeholder="Message Qwen" required></textarea>
        <button id="send" type="submit">Send</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </main>
  </div>
  <script>
    const messagesBox = document.getElementById('messages')
    const input = document.getElementById('message-input')
    const sendButton = document.getElementById('send')
    const status = document.getElementById('status')
    // Only the displayed HTML holds past messages; there is no saved chat list.
    let waiting = false

    function showWelcome() {
      messagesBox.replaceChildren()
      const welcome = document.createElement('div')
      welcome.className = 'empty'
      welcome.textContent = 'What would you like to ask?'
      messagesBox.append(welcome)
    }

    function showMessage(role, content) {
      // Remove the welcome text when the first message appears.
      if (messagesBox.querySelector('.empty')) messagesBox.replaceChildren()
      const bubble = document.createElement('div')
      bubble.className = 'message ' + role
      bubble.textContent = content
      messagesBox.append(bubble)
      messagesBox.scrollTop = messagesBox.scrollHeight
      return bubble
    }

    document.getElementById('new-chat').addEventListener('click', () => {
      // Keep the current display until a request finishes, then allow clearing it.
      if (waiting) return
      showWelcome()
      status.textContent = ''
      input.value = ''
      input.focus()
    })

    document.getElementById('composer').addEventListener('submit', async event => {
      event.preventDefault()
      const question = input.value.trim()
      // Do not send an empty question or start another request while one is pending.
      if (!question || waiting) return

      const userBubble = showMessage('user', question)
      const note = showMessage('assistant', 'Qwen is replying…')
      waiting = true
      sendButton.disabled = true
      status.textContent = ''

      try {
        // The browser sends only this question; earlier visible messages are not included.
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question }),
        })
        // Throwing here moves a failed HTTP response into the catch block below.
        if (!response.ok) throw new Error('The model could not complete the reply')
        const result = await response.json()
        note.textContent = result.content
        input.value = ''
      } catch (error) {
        // A failed send leaves the question in the text box so it can be retried.
        userBubble.remove()
        note.remove()
        if (!messagesBox.childElementCount) showWelcome()
        status.textContent = error.message
      } finally {
        // finally runs after either success or failure, so Send always becomes usable again.
        waiting = false
        sendButton.disabled = false
        input.focus()
      }
    })

    input.addEventListener('keydown', event => {
      // Enter sends; Shift+Enter remains available for a new line.
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault()
        document.getElementById('composer').requestSubmit()
      }
    })

    showWelcome()
  </script>
</body>
</html>
