[project]
name = "qwen-harness"
version = "0.1.0"
description = "A small learning harness for local vLLM chat requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]
[project.scripts]
qwen-harness = "qwen_harness.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"
